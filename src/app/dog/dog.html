<div
  class="group/wrap relative size-full"
  [class.side-r]="side() === 'r'"
  [class.barking]="barking()"
  [style.--fur]="spec().fur"
  [style.--belly]="spec().belly"
  [style.--ear]="spec().ear"
  [style.--nose]="spec().nose"
  [style.--collar]="spec().collar"
  [style.--k]="k()"
>
  <span class="pointer-events-none absolute top-[-4%] left-1/2 z-5 origin-[50%_100%] [transform:translateX(-50%)_scale(0)] rounded-[999px] bg-white px-[0.55em] py-[0.15em] text-[length:max(0.7rem,calc(var(--dw)*0.2))] font-extrabold whitespace-nowrap text-[#7e22ce] opacity-0 shadow-[0_4px_10px_rgba(0,0,0,0.3)] group-[.barking]/wrap:animate-[dog-bark_0.5s_cubic-bezier(0.2,1.6,0.4,1)_calc(0.55s_+_var(--k)_*_0.09s)_forwards] after:absolute after:top-full after:left-1/2 after:-ml-[6px] after:border-[6px] after:border-solid after:border-transparent after:border-t-white after:content-['']" aria-hidden="true">¡Guau!</span>

  <svg
    viewBox="0 0 200 260"
    class="block size-full overflow-visible [filter:drop-shadow(0_4px_5px_rgba(0,0,0,0.25))] group-[.side-r]/wrap:[transform:scaleX(-1)] [&_.o]:stroke-[rgba(45,22,40,0.35)] [&_.o]:[stroke-linejoin:round] [&_.o]:[stroke-width:2.5]"
    role="img"
    [attr.aria-label]="spec().name"
  >
    <ellipse class="fill-[rgba(0,0,0,0.3)]" cx="100" cy="254" rx="72" ry="6" />

    <!-- Cola -->
    <g class="origin-[66px_224px] animate-[dog-wag_0.5s_ease-in-out_calc(var(--k)_*_-0.12s)_infinite_alternate] group-[.barking]/wrap:[animation-duration:0.18s] motion-reduce:animate-none">
      <path class="fill-none stroke-[color:var(--fur)] [stroke-linecap:round] [stroke-width:17]" d="M66 224 C30 218 18 184 32 158" />
    </g>

    <!-- Cuerpo -->
    <ellipse class="o fill-(--fur)" cx="100" cy="196" rx="56" ry="60" />
    <ellipse class="o fill-(--fur) [filter:brightness(0.93)]" cx="54" cy="228" rx="25" ry="22" />
    <ellipse class="o fill-(--fur) [filter:brightness(0.93)]" cx="146" cy="228" rx="25" ry="22" />
    <ellipse class="o fill-(--belly)" cx="48" cy="250" rx="19" ry="8" />
    <ellipse class="o fill-(--belly)" cx="152" cy="250" rx="19" ry="8" />
    <ellipse class="fill-(--belly)" cx="100" cy="202" rx="32" ry="46" />

    <!-- Patas delanteras -->
    <rect class="o fill-(--fur)" x="71" y="200" width="24" height="50" rx="12" />
    <rect class="o fill-(--fur)" x="105" y="200" width="24" height="50" rx="12" />
    <ellipse class="o fill-(--belly)" cx="83" cy="251" rx="16" ry="8" />
    <ellipse class="o fill-(--belly)" cx="117" cy="251" rx="16" ry="8" />
    <path class="fill-none stroke-[rgba(45,22,40,0.35)] [stroke-linecap:round] [stroke-width:2]" d="M78 247 v5 M88 247 v5 M112 247 v5 M122 247 v5" />

    <!-- Collar o pañoleta -->
    @if (spec().bandana) {
      <polygon class="o fill-[#dc2626]" points="64,146 136,146 100,192" />
      <path class="fill-none stroke-[rgba(0,0,0,0.3)] [stroke-width:3]" d="M76 152 L100 182 M124 152 L100 182 M88 148 L100 168 M112 148 L100 168" />
      <circle class="fill-[#b91c1c]" cx="100" cy="148" r="6" />
    } @else {
      <path class="fill-none stroke-[color:var(--collar)] [stroke-linecap:round] [stroke-width:9]" d="M68 148 Q100 172 132 148" />
      <circle class="o fill-[#fde047]" cx="100" cy="166" r="6" />
    }

    <!-- Cabeza -->
    <g class="origin-[100px_150px] animate-[dog-tilt_4.5s_ease-in-out_calc(var(--k)_*_-1.1s)_infinite] motion-reduce:animate-none">
      <!-- Orejas -->
      @switch (spec().style) {
        @case ('fold') {
          <path class="o fill-(--ear)" d="M62 66 C40 56 26 80 32 108 C50 108 64 92 66 74 Z" />
          <path class="o fill-(--ear)" d="M138 66 C160 56 174 80 168 108 C150 108 136 92 134 74 Z" />
        }
        @case ('fluffy') {
          <path class="o fill-(--ear)" d="M60 62 C24 58 16 118 40 146 C62 146 72 108 68 74 Z" />
          <path class="o fill-(--ear)" d="M140 62 C176 58 184 118 160 146 C138 146 128 108 132 74 Z" />
        }
        @case ('shaggy') {
          <path class="o fill-(--ear)" d="M58 66 C34 62 24 100 40 128 C58 128 68 104 66 78 Z" />
          <path class="o fill-(--ear)" d="M142 66 C166 62 176 100 160 128 C142 128 132 104 134 78 Z" />
        }
        @default {
          <path class="o fill-(--ear)" d="M58 70 C28 70 20 122 40 144 C60 144 70 112 66 80 Z" />
          <path class="o fill-(--ear)" d="M142 70 C172 70 180 122 160 144 C140 144 130 112 134 80 Z" />
        }
      }

      <ellipse class="o fill-(--fur)" cx="100" cy="104" rx="54" ry="48" />

      @if (spec().style === 'shaggy') {
        <path
          class="o fill-(--fur)"
          d="M48 96 L38 84 L54 88 L48 70 L66 82 L66 62 L80 78 L86 58 L98 76 L108 58 L116 78 L130 62 L132 82 L148 70 L146 88 L162 84 L152 96 Z"
        />
        <path class="o fill-(--fur)" d="M56 128 L44 138 L60 136 L54 150 L70 140 Z" />
        <path class="o fill-(--fur)" d="M144 128 L156 138 L140 136 L146 150 L130 140 Z" />
      }
      @if (spec().style === 'fluffy') {
        <path class="o fill-(--fur)" d="M54 88 Q78 66 100 74 Q122 66 146 88 Q124 80 100 84 Q76 80 54 88 Z" />
      }

      <!-- Hocico -->
      <ellipse class="fill-(--belly)" cx="100" cy="124" rx="30" ry="23" />

      <!-- Lengua y boca -->
      <path class="origin-[50%_0] animate-[dog-pant_0.9s_ease-in-out_calc(var(--k)_*_-0.2s)_infinite_alternate] fill-[#ff7aa8] stroke-[rgba(150,30,80,0.4)] [transform-box:fill-box] [stroke-width:1.5] motion-reduce:animate-none" d="M93 135 Q100 164 109 135 Z" />
      <path class="fill-none stroke-[#3b2b2f] [stroke-linecap:round] [stroke-width:3]" d="M100 122 V131 M86 131 Q100 146 114 131" />

      <!-- Nariz -->
      <ellipse class="fill-(--nose)" cx="100" cy="114" rx="12" ry="8.5" />
      <ellipse class="fill-[rgba(255,255,255,0.55)]" cx="96" cy="111" rx="3.5" ry="1.8" />

      <!-- Ojos -->
      <g class="origin-center animate-[dog-blink_4.2s_ease-in-out_calc(var(--k)_*_-0.9s)_infinite] [transform-box:fill-box] motion-reduce:animate-none">
        <circle class="fill-[#241a1f]" cx="78" cy="98" r="8.5" />
        <circle class="fill-[#241a1f]" cx="122" cy="98" r="8.5" />
        <circle class="fill-white" cx="75" cy="95" r="3.2" />
        <circle class="fill-white" cx="119" cy="95" r="3.2" />
      </g>
      <path class="fill-none stroke-[rgba(45,22,40,0.45)] [stroke-linecap:round] [stroke-width:3]" d="M66 84 Q77 76 90 82 M110 82 Q123 76 134 84" />

      <!-- Mejillas -->
      <ellipse class="fill-[#ff9ad5] opacity-40" cx="62" cy="122" rx="9" ry="5.5" />
      <ellipse class="fill-[#ff9ad5] opacity-40" cx="138" cy="122" rx="9" ry="5.5" />
    </g>
  </svg>
</div>
